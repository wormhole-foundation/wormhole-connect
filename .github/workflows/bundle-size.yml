name: Bundle Size Check

on:
  pull_request:
    paths:
      - 'wormhole-connect/**'

jobs:
  analyze-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wormhole-connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "wormhole-connect/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build and analyze bundle
        run: npm run analyze:ci

      - name: Check bundle sizes
        run: |
          MAX_CHUNK_SIZE=$((1024 * 1024)) # 1MB in bytes
          echo "Bundle sizes:"
          
          if [ ! -f "stats.json" ]; then
            echo "Error: stats.json not found"
            exit 1
          fi
          
          # Debug the structure
          echo "JSON structure:"
          jq -r 'keys' stats.json
          
          # For Rollup stats, look at the root level entries
          CHUNKS=$(jq -r '
            [to_entries[] | select(.key | test("^[^\\.].*\\.js$"))] |
            map({name: .key, size: .value}) |
            sort_by(.size) | reverse[] |
            "\(.name): \(.size/1024 | floor)KB"
          ' stats.json)
          
          echo "$CHUNKS"
          
          # Check for large chunks
          LARGE_CHUNKS=$(jq -r --arg max "$MAX_CHUNK_SIZE" '
            [to_entries[] | select(.key | test("^[^\\.].*\\.js$"))] |
            map(select(.value > ($max | tonumber))) |
            .[] |
            "\(.key) (\(.value/1024/1024 | floor)MB)"
          ' stats.json)
          
          if [ ! -z "$LARGE_CHUNKS" ]; then
            echo "::warning ::The following chunks exceed 1MB:"
            echo "$LARGE_CHUNKS"
            echo "Consider code splitting or optimizing these chunks."
          else
            echo "All chunks are within size limits!"
          fi
