name: Build

on:
  pull_request:
  push:
    branches:
      - development
      - staging
      - production
      - mainnet

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "wormhole-connect/package-lock.json"
      - run: npm ci
        working-directory: wormhole-connect
      - run: npm run lint:ci
        working-directory: wormhole-connect

  # TODO: figure out why GitHub still runs this test job
  # even when we remove it and clear the workflow cache
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Run Tests
        run: echo "Skipping test"

  check-sdn-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run script
        run: npm i prettier && npm run checksdn
        working-directory: wormhole-connect

  check-token-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tokens:
              - 'wormhole-connect/src/config/mainnet/wrappedTokens.ts'
              - 'wormhole-connect/src/config/testnet/wrappedTokens.ts'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.tokens == 'true' || github.ref == 'refs/heads/development'
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "wormhole-connect/package-lock.json"
      - run: npm ci
        if: steps.filter.outputs.tokens == 'true' || github.ref == 'refs/heads/development'
        working-directory: wormhole-connect
      - run: npm run checkForeignAssets
        if: steps.filter.outputs.tokens == 'true' || github.ref == 'refs/heads/development'
        working-directory: wormhole-connect

  build-hosted:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "wormhole-connect/package-lock.json"
      - run: npm ci
        working-directory: wormhole-connect
      - run: npm run build:hosted
        working-directory: wormhole-connect
  build-library:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "wormhole-connect/package-lock.json"
      - run: npm ci
        working-directory: wormhole-connect
      - name: Build Lib
        run: npm run build:lib 2>&1 | tee build-output.txt
        working-directory: wormhole-connect
      - name: Check bundle sizes
        run: |
          echo "Checking JS bundle sizes..."
          SIZE_LIMIT_KB=1024 # 1MB in KB
          
          # Create a temporary file to store the status
          touch /tmp/large_bundle_found
          
          # Find all JS files and their gzip sizes
          grep "\.js.*│.*gzip:" build-output.txt | while read -r line; do
            # Extract filename and size, stripping ANSI color codes
            filename=$(echo "$line" | awk '{print $1}' | sed 's/\x1b\[[0-9;]*m//g')
            size_kb=$(echo "$line" | grep -o 'gzip:.*kB' | grep -o '[0-9,.]*' | tr -d ',' | bc)
            
            if (( $(echo "$size_kb > $SIZE_LIMIT_KB" | bc -l) )); then
              size_mb=$(echo "scale=2; $size_kb/1024" | bc)
              echo "❌ Error: $filename is ${size_mb}MB gzipped (exceeds 1MB limit)"
              echo "::error file=wormhole-connect/package.json,line=1,title=Large Bundle: ${filename}::Bundle size ${size_mb}MB gzipped (exceeds 1MB limit). This may impact load times and performance."
              echo "true" > /tmp/large_bundle_found
            fi
          done
          
          if [ "$(cat /tmp/large_bundle_found)" = "true" ]; then
            echo "::error file=wormhole-connect/package.json,line=1,title=Bundle Size Optimization Required::Some bundles exceed the 1MB size limit. Consider these optimizations:%0A• Use dynamic imports (React.lazy) for route-based code splitting%0A• Analyze your bundle with 'npm run analyze' to identify large dependencies%0A• Review and remove unused exports/imports%0A• Consider breaking up large components into smaller chunks"
            # Uncomment the next line to fail the build if a large bundle is found
            # exit 1
          fi
          
          rm -f /tmp/large_bundle_found
        working-directory: wormhole-connect
